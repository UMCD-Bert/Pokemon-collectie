<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F4F7"/>
      <stop offset="100%" stop-color="#DDE2E8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5A52"/>
      <stop offset="100%" stop-color="#E0342B"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="168"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="256" cy="440" rx="132" ry="16" fill="#1A1512" opacity="0.12"/>

  <!-- pokeball -->
  <g clip-path="url(#ballClip)">
    <rect x="0" y="88" width="512" height="168" fill="url(#red)"/>
    <rect x="0" y="256" width="512" height="168" fill="#FFFFFF"/>
    <rect x="0" y="240" width="512" height="32" fill="#1A1512"/>
    <ellipse cx="205" cy="150" rx="70" ry="34" fill="#FFFFFF" opacity="0.25" transform="rotate(-18 205 150)"/>
  </g>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1A1512" stroke-width="7"/>

  <!-- center button -->
  <circle cx="256" cy="256" r="54" fill="#1A1512"/>
  <circle cx="256" cy="256" r="41" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="41" fill="none" stroke="#1A1512" stroke-width="6"/>
  <ellipse cx="243" cy="243" rx="13" ry="9" fill="#FFFFFF" opacity="0.9" transform="rotate(-30 243 243)"/>
</svg>
