name: Dagelijkse prijsupdate

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prijzen verversen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POKEWALLET_KEY: ${{ secrets.POKEWALLET_KEY }}
        run: node scripts/update-prices.mjs
      - name: Eigen kopie van kaartfoto's bijwerken
        # Spiegelt foto's van eigen exemplaren naar de eigen opslag (TCGdex-storingen vangen we zo op).
        # Mislukt dit, dan komt het de volgende dag opnieuw aan de beurt; de prijsupdate hierboven blijft geldig.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/mirror-photos.mjs
      - name: Lorcana-kaarten en -prijzen (USD) bijwerken
        # Lorcast -> lorcana_set_kaarten, voor de Lorcana-onderdelen in de native app. Los van de Pokémon-update.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/update-lorcana.mjs
      - name: Magic-prijzen (EUR) van eigen kaarten bijwerken
        # Scryfall -> magic_kaarten, alleen kaarten in magic_exemplaren. Los van de Pokémon-update.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/update-magic.mjs
